<text x="540" y="330" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="150" font-weight="bold" fill="#ffffff" letter-spacing="26">疯狂星期寺</text>
<text x="540" y="440" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="40" fill="#ffffff" fill-opacity="0.9" letter-spacing="10">—— 全网最灵 · 求签就求五十字签 ——</text>
<rect x="180" y="540" width="720" height="420" rx="30" fill="#ffffff"/>
<text x="540" y="700" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="46" fill="#2b2b2b" letter-spacing="6">签文曰：</text>
<text x="540" y="800" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="64" font-weight="bold" fill="#e4002b" letter-spacing="8">佛说 V 我 50 香火</text>
