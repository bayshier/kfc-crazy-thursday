<text x="540" y="1120" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="32" fill="#ffffff" fill-opacity="0.92" letter-spacing="6">求姻缘 · 求暴富 · 求炸鸡</text>
<text x="540" y="1190" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="28" fill="#ffffff" fill-opacity="0.92" letter-spacing="6">每 签 50 元 · 概不赊账</text>
